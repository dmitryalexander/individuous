# YouTube gateway (nginx). This file is a template: when the gateway starts, ${PT_SID} below is
# replaced with AUTO_SESSION_ID from .env (only PT_ variables are substituted).
#
# Automatic sign-in: every request to Invidious carries the fixed session id of the one account
# (registered in the database by the autologin service, docker/autologin.sql). Any SID cookie the
# browser still has from a manual sign-in is removed first, so only the fixed one is sent.
map $http_cookie $pt_cookie_rest {
    "~^SID=[^;]*(?:;\s*)?(?<pt_after>.*)$"            "$pt_after";
    "~^(?<pt_before>.*?);\s*SID=[^;]*(?<pt_tail>.*)$"  "$pt_before$pt_tail";
    default                                            $http_cookie;
}
# A second pass removes a leftover duplicate (a browser can hold two SID cookies).
map $pt_cookie_rest $pt_cookie_rest2 {
    "~^SID=[^;]*(?:;\s*)?(?<pt_after2>.*)$"             "$pt_after2";
    "~^(?<pt_before2>.*?);\s*SID=[^;]*(?<pt_tail2>.*)$"  "$pt_before2$pt_tail2";
    default                                              $pt_cookie_rest;
}
map $pt_cookie_rest2 $pt_cookie {
    ""       "SID=${PT_SID}";
    default  "SID=${PT_SID}; $pt_cookie_rest2";
}

map $request_method $app_write { default 1; GET 0; HEAD 0; OPTIONS 0; }
server {
    error_page 418 = @app_write;
    location @app_write {
        proxy_pass http://appdata:8080;
        proxy_set_header X-App-Proxy 1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $pt_cookie;
        proxy_read_timeout 100s;
    }
    location ~ ^/(watch|feed/subscriptions|toggle_theme|subscribe_playlist|modify_notifications)$ {
        return 418;
    }
    listen 80;
    client_max_body_size 20m;
    location /youtube-account/ {
        if ($app_write) { return 418; }
        proxy_pass http://youtube-account:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_read_timeout 65s;
        client_max_body_size 28k;
    }
    # Playlists, search groups and other app data saved on the server (appdata/store.py).
    location /app-data/ {
        proxy_set_header X-App-Proxy "";
        proxy_pass http://appdata:8080/;
        proxy_set_header Host $http_host;
        client_max_body_size 100m;
    }
    location = / { absolute_redirect off; return 302 /star.html; }
    # One user, always signed in: the sign-in, register and sign-out pages are switched off.
    location = /login { absolute_redirect off; return 303 /feed/subscriptions; }
    location = /signout { absolute_redirect off; return 303 /feed/subscriptions; }
    location / {
        if ($app_write) { return 418; }
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        proxy_pass http://invidious:3000;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $pt_cookie;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
}
